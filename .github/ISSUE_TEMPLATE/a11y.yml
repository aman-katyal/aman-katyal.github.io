name: "♿ Accessibility (A11Y)"
description: Report a WCAG violation, contrast issue, keyboard navigation problem, or ARIA issue
title: "[A11Y]: "
labels: ["type:a11y", "priority:high", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        ## Accessibility Issue
        Use this template for contrast failures, missing alternative text,
        keyboard navigation defects, or WCAG 2.2 AA non-conformance.

  - type: textarea
    id: description
    attributes:
      label: "♿ Issue Description"
      description: What accessibility barrier exists?
      placeholder: "e.g., Image missing descriptive alt text in project detail markdown."
    validations:
      required: true

  - type: dropdown
    id: wcag_criterion
    attributes:
      label: "📐 WCAG Criterion Violated"
      options:
        - "1.1.1 — Non-text Content (Alt text)"
        - "1.4.3 — Contrast (Minimum) AA"
        - "1.4.11 — Non-text Contrast AA"
        - "2.1.1 — Keyboard Navigation"
        - "2.4.7 — Focus Visible"
        - "4.1.2 — Name, Role, Value (ARIA)"
        - "Other / Multiple"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "📍 Affected Area"
      options:
        - "area:home — Home page, hero profile, bio card, project cards"
        - "area:projects — Project case studies (ASIC, RISC-V, ROV, ESP32, ML)"
        - "area:print — Print portfolio layout and @media print CSS"
        - "area:nav — Navbar, breadcrumbs, footer, social links"
        - "area:styles — CSS tokens, dark mode, typography, Rouge code themes"
        - "area:assets — Images, schematics, compression, preview cards"
        - "area:seo — Meta tags, OpenGraph, Twitter cards, alt texts"
    validations:
      required: true

  - type: textarea
    id: requested_changes
    attributes:
      label: "🔧 Requested Changes"
      placeholder: |
        - Provide descriptive alt attributes for images
        - Ensure focus ring is visible on interactive elements
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "☑️ Acceptance Criteria"
      placeholder: |
        - [ ] Meets WCAG 2.2 AA requirements
        - [ ] Verified with accessibility checker and keyboard navigation
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "📌 Pre-submission Checklist"
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have identified the specific WCAG criterion above
          required: true
