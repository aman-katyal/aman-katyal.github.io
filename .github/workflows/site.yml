name: Site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check-links:
    name: Jekyll build + link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # lychee posts a summary issue on broken links
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll (same engine Pages uses)
        run: bundle exec jekyll build --destination _site --trace

      # LinkedIn answers bots with 999 — accept it so the profile link passes.
      - name: Check links in built HTML
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept '200..=204,206,999' './_site/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
