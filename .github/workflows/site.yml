name: Site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check-links:
    name: Jekyll build + link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install test dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Lint SCSS
        run: npm run lint:css

      - name: Build with Jekyll (same engine Pages uses)
        run: bundle exec jekyll build --destination _site --trace

      - name: Verify SCSS partials were inlined
        run: |
          if grep -q '@import' _site/assets/css/style.css; then
            echo "::error::Jekyll left @import rules unresolved in the compiled stylesheet"
            exit 1
          fi
          test -s _site/assets/css/style.css

      # LinkedIn answers link-check bots with 999, so it is excluded;
      # every other internal/external link is verified live.
      - name: Check links in built HTML
        run: >
          bundle exec htmlproofer ./_site --assume-extension --allow-hash-href
