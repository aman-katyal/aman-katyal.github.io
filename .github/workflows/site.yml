name: Site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check-links:
    name: Jekyll build + link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll (same engine Pages uses)
        run: bundle exec jekyll build --destination _site --trace

      # LinkedIn answers link-check bots with 999, so it is excluded;
      # every other internal/external link is verified live.
      - name: Check links in built HTML
        run: >
          bundle exec htmlproofer ./_site --assume-extension
          --ignore-urls /linkedin\.com/,/fonts\.googleapis\.com/,/fonts\.gstatic\.com/ --allow-hash-href
