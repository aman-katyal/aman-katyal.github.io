    - "Engineered an ESP32-S3 wearable network gathering motion data from 3 IMUs placed on both shoulders and neck, streaming quaternions over BLE to an Arduino Uno Q."
    - "Trained an on-device posture-detection Dense Neural Network (MLP) with Edge Impulse on an AMD AI PC using ROCm acceleration, achieving up to 98.18% accuracy."
    - "Deployed OpenCV and MediaPipe computer vision on an AMD AI PC for supplementary posture classification, streaming live inference over WiFi/UDP sockets."
    - "Integrated dual model outputs on the Arduino Uno Q to actuate servos that physically reflect and correct posture in real time."
