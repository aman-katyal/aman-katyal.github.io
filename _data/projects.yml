  summary: "Low-latency hardware translation bridge built on ESP32-S3 and TinyUSB stack. Intercepts Bluetooth HID packets from third-party controllers and emulates a bit-accurate Nintendo Switch Pro Controller with sub-30ms latency."
  highlights:
    - "Configured TinyUSB USB descriptors to spoof Nintendo Vendor ID (0x0F0D) and Product ID (0x00C1) for native console peripheral recognition."
    - "Architected packed 8-byte HID report bitmask matching Nintendo Switch Pro Controller specifications (14 buttons, 4-bit D-pad, 4 analog axes)."
    - "Implemented dual-core task segregation: Core 0 runs Bluedroid Bluetooth stack; Core 1 runs high-frequency HID translation and USB report dispatch."
    - "Applied ESP-IDF heap tracing and static buffer allocation to eliminate memory fragmentation and guarantee zero allocation latency during play."
    - "Achieved sub-30ms end-to-end controller conversion latency using non-blocking FreeRTOS queues."
