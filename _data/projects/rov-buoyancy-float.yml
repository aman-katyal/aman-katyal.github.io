summary: 'Autonomous subsea profiling buoyancy float engineered for automated water column data collection. Features deterministic bare-metal C firmware on RP2040, 10Hz neutral-buoyancy feedforward PID holding depth within 5 cm, 915MHz LoRa telemetry, and bsdiff differential OTA updates that cut firmware refreshes from 8 minutes to under 20 seconds.'
highlights:
  - 'Architected deterministic dual-rate bare-metal C firmware on RP2040 (50Hz inner actuator loop, 10Hz outer depth control loop) replacing legacy CircuitPython scripts.'
  - 'Developed neutral-buoyancy ADC baseline feedforward control law eliminating steady-state depth hunting and vertical overshoot.'
  - 'Implemented adaptive hover learning that calibrates buoyancy baseline in-situ and persists salinity/temperature compensation to LittleFS flash.'
  - 'Constructed an in-situ secondary OTA bootloader with bsdiff differential patching over 915MHz SX1276 LoRa, reducing firmware update time from 8 minutes to under 20 seconds.'
  - 'Designed 3-tier I2C sensor recovery matrix (soft reset, clock cycle toggle, emergency positive-buoyancy abort surface blow).'
  - 'Created Python/Streamlit mission control dashboard with thread-safe telemetry ingestion and UNESCO EOS-80 hydrodynamics HIL simulation.'
