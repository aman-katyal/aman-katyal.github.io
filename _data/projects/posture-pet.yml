summary: "A wearable AI companion built at the StarkHacks Hardware Hackathon (Purdue University) that won Honorable Mention for Best Use of AMD Tech. Utilizes a hybrid system of wearable 3-IMU sensors and computer vision to track posture in real time at up to 98.18% detection accuracy, mirroring the user's spinal state on an articulating 3D-printed robotic pet."
highlights:
  - 'Awarded Honorable Mention for Best Use of AMD Tech at the StarkHacks Hardware Hackathon (Purdue University).'
  - "Designed the pet's body and articulating base from the ground up in Onshape, rapidly iterated with custom 3D-printed assemblies."
  - 'Engineered an ESP32-S3 wearable network gathering motion data from 3 IMUs placed on both shoulders and neck, streaming quaternions over BLE to an Arduino Uno Q.'
  - 'Trained an on-device posture-detection Dense Neural Network (MLP) with Edge Impulse on an AMD AI PC using ROCm acceleration, achieving up to 98.18% accuracy.'
  - 'Deployed OpenCV and MediaPipe computer vision on an AMD AI PC for supplementary posture classification, streaming live inference over WiFi/UDP sockets.'
  - 'Integrated dual model outputs on the Arduino Uno Q to actuate servos that physically reflect and correct posture in real time.'
