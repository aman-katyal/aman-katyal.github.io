  <!-- Footer -->
  <footer class="footer no-print">
    <div class="footer-container">
      <div class="footer-left">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}. All rights reserved.</p>
        <p class="academic-affiliation">Computer Engineering @ Purdue University</p>
        <a class="footer-pdf-link" href="{{ '/print-portfolio/' | relative_url }}"><i class="fa-solid fa-file-pdf"></i> Custom PDF portfolio →</a>
      </div>
      <div class="footer-right">
        <div class="social-links">
          <button type="button" data-copy-email="{{ site.email }}" aria-label="Copy email address to clipboard" title="Click to copy email"><i class="fa-solid fa-envelope"></i></button>
          <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" data-proofer-ignore><i class="fa-brands fa-linkedin"></i></a>
          <a href="{{ site.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scroll-to-Top Button -->
  <button id="scroll-to-top" class="scroll-to-top-btn no-print" aria-label="Scroll to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- Copy-to-clipboard toast (email button feedback) -->
  <div id="copy-toast" class="copy-toast" role="status" aria-live="polite"></div>
